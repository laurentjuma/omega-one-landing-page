# Builds the landing page and publishes it to GitHub Pages.
#
# The site is a static export, so a deploy is: pull the app's published content, cut the images,
# build, upload. The schedule is what keeps the page current — new About copy or a new mix reaches
# the site on the next run without anyone touching the repo.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every day at 04:20 UTC, which is 07:20 in Kisumu.
    - cron: "20 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a running one finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Pull the published content
        # The committed copy of the content is the fallback, so a feed being down delays the
        # refresh rather than failing the deploy.
        continue-on-error: true
        run: npm run sync

      - name: Build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}${{ steps.pages.outputs.base_path }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
